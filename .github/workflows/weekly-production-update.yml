name: Weekly Production Update

on:
  schedule:
    # Sunday 09:00 KST = Sunday 00:00 UTC.
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-production-update
  cancel-in-progress: false

jobs:
  collect-and-publish-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect and score new papers
        env:
          LMI_CROSSREF_MAILTO: ${{ secrets.LMI_CROSSREF_MAILTO }}
        run: >-
          python -m paper_agent.run_weekly_update
          --config-dir config
          --catalog-file data/catalog/papers_table.csv
          --reports-dir data/weekly_updates
          --state-file data/weekly_collection_state.json
          --web-labels-file data/reviews.csv
          --lookback-days 14
          --rows-per-query 1000
          --max-pages 5
          --pause-seconds 0.5

      - name: Export abstract discovery candidates
        run: >-
          python -m paper_agent.export_site_json
          --catalog-file data/catalog/papers_table.csv
          --state-file data/weekly_collection_state.json
          --recommendations-file config/expert_recommendations.csv
          --source-index data/paper_analysis/source_index.json
          --output public/data/papers.json
          --since-days 365
          --include-missing-abstracts

      - name: Collect abstracts for new papers
        run: >-
          python -m paper_agent.run_paper_analysis discover
          --papers-file public/data/papers.json
          --source-index data/paper_analysis/source_index.json
          --skip-public-index
          --retry-days 14
          --batch-size 20
          --pause-seconds 0.1

      - name: Backfill missing abstracts from Crossref
        env:
          LMI_CROSSREF_MAILTO: ${{ secrets.LMI_CROSSREF_MAILTO }}
        run: >-
          python -m paper_agent.backfill_abstracts
          --papers-file public/data/papers.json
          --source-index data/paper_analysis/source_index.json
          --retry-days 30
          --pause-seconds 0.25

      - name: Publish papers with abstracts
        run: >-
          python -m paper_agent.export_site_json
          --catalog-file data/catalog/papers_table.csv
          --state-file data/weekly_collection_state.json
          --recommendations-file config/expert_recommendations.csv
          --source-index data/paper_analysis/source_index.json
          --output public/data/papers.json
          --since-days 365

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm build

      - name: Commit collected data
        run: |
          git config user.name "lmi-paper-agent[bot]"
          git config user.email "lmi-paper-agent[bot]@users.noreply.github.com"
          git add data/catalog data/weekly_updates data/weekly_collection_state.json data/paper_analysis/source_index.json public/data/papers.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update weekly paper catalog"
            git push
          fi

      # The data commit above triggers deploy-pages.yml. Keeping collection and
      # deployment in separate workflows avoids them cancelling one another.
